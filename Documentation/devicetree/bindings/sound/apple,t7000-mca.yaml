%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/apple,t7000-mca.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple A8 MCA I2S/TDM controller

maintainers:
  - ITSMEFRTRUST <215584995+ITSMEFRTRUST@users.noreply.github.com>

description: |
  One serial audio port of the "version 1" Multi-Channel Audio (MCA) block
  on the Apple A8 SoC. Samples reach the MCA through a small SRAM FIFO
  ("shim") that iOS fills from the SmartIO coprocessor and that the CPU can
  fill directly. The shim control registers and the I2S pin switch sit in
  wrapper pages shared by all MCA instances.

allOf:
  - $ref: dai-common.yaml#

properties:
  compatible:
    const: apple,t7000-mca

  reg:
    items:
      - description: MCA core, its shims and their FIFO ports
      - description: shared audio wrapper (shim control, MCLK pads, I2S switch)
      - description: shared second shim wrapper

  reg-names:
    items:
      - const: mca
      - const: wrapper
      - const: shim1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1
    description: NCO channel that clocks the frame generator

  power-domains:
    maxItems: 1

  apple,i2s-pin:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 16
    description:
      I2S switch pin group the port is routed to. Defaults to the MCA index.

  apple,shim-sram-offset:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 0x3fc
    multipleOf: 4
    default: 0
    description:
      Byte offset of this MCA's FIFOs in the TX and RX shim SRAM pools
      (0x400 bytes each), so that MCAs running at once do not overlap.

  '#sound-dai-cells':
    enum: [0, 1]
    description:
      With 1 cell, DAI 0 is the playback-only DAI and DAI 1 a second DAI
      with playback and capture, for a second codec on the same bus. Both
      share the one TX slot.

  '#clock-cells':
    const: 1
    description:
      The node provides the MCLK pads of all MCA instances (index 0-4) as
      12 MHz clocks, for a codec clocked from the pad of an unused MCA.

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - power-domains
  - '#sound-dai-cells'

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/apple-aic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    soc {
        #address-cells = <2>;
        #size-cells = <2>;

        i2s@20a0a8000 {
            compatible = "apple,t7000-mca";
            reg = <0x2 0x0a0a8000 0x0 0x4000>,
                  <0x2 0x0a000000 0x0 0x4000>,
                  <0x2 0x0a100000 0x0 0x1000>;
            reg-names = "mca", "wrapper", "shim1";
            interrupts = <AIC_IRQ 171 IRQ_TYPE_LEVEL_HIGH>;
            clocks = <&nco 2>;
            power-domains = <&ps_mca2>;
            #sound-dai-cells = <1>;
            #clock-cells = <1>;
        };
    };
